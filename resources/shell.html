<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta http-equiv="x-ua-compatible" content="ie=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Pragtical</title>

	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #1e1e1e;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
		}

		#canvas {
			width: 100%;
			height: 100%;
			display: block;
			outline: none;
			touch-action: none;
		}

		.modal {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #ddd;
			text-align: center;
		}

		#status {
			max-width: min(90vw, 52rem);
			white-space: pre-wrap;
		}

		#close {
			display: none;
		}
	</style>
</head>

<body>
	<canvas id="canvas" tabindex="0" aria-label="Pragtical editor"></canvas>
	<div class="modal" id="loading">
		<h2>Loading Pragtical...</h2>
		<p>Status: <span id="status">Starting WebAssembly...</span></p>
		<p>If this page fails to load, please check the console for errors.</p>
	</div>
	<div class="modal" id="close">
		<h2>Pragtical is closed.</h2>
		<p>You can refresh the page to start it again.</p>
	</div>
	<noscript>
		<p>Pragtical requires JavaScript and WebAssembly.</p>
	</noscript>

	<script type="application/javascript">
		(function () {
			var canvas = document.getElementById('canvas');
			var loading = document.getElementById('loading');
			var status = document.getElementById('status');
			var close = document.getElementById('close');

			window.Module = {
				canvas: canvas,
				arguments: ['/home/web_user/welcome.md'],
				preRun: [function () {
					if (!FS.analyzePath('/home/web_user').exists) FS.mkdirTree('/home/web_user');
					ENV.PRAGTICAL_PREFIX = '/usr';
					FS.chdir('/home/web_user');
					if (!FS.analyzePath('/home/web_user/welcome.md').exists) {
						FS.writeFile('/home/web_user/welcome.md',
							'# Welcome to Pragtical!\n\n' +
							'This is an instance of Pragtical running on your browser using **JavaScript** and **WASM**.\n\n' +
							'There isn\'t a lot of things you can do here; you can **create, edit and save files**,\n' +
							'but they _will not be persisted_ across different tabs / sessions.\n\n' +
							'Not all plugins work, and **some keyboard shortcuts might not work** if your browser\n' +
							'overrides them. Nevertheless, this is pretty cool.\n');
					}
				}],
				setStatus: function (text) {
					if (text) status.textContent = text;
				},
				onRuntimeInitialized: function () {
					loading.style.display = 'none';
					canvas.focus();
				},
				onExit: function () {
					loading.style.display = 'none';
					canvas.style.display = 'none';
					close.style.display = 'block';
				},
				onAbort: function (reason) {
					status.textContent = 'Pragtical could not start.\n' + (reason || 'Unknown error');
				}
			};

			canvas.addEventListener('contextmenu', function (event) { event.preventDefault(); });
			canvas.addEventListener('pointerdown', function () { canvas.focus(); });
		})();
	</script>
	<script type="application/javascript" src="./pragtical.js"></script>
</body>

</html>
