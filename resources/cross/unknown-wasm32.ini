# Cross file for the single-threaded Emscripten web target.
# The web build script supplies the Emscripten tools on PATH before invoking
# Meson. You can import this file from another machine file to override the
# memory and linker settings for local experiments.

[constants]

# Keep Asyncify available for future browser bridges, but do not carry forward
# symbol names from the old SDL2/dependency set that Emscripten now warns about.
asyncify_ignores = '[]'

# Enable advising for optimizing the list above; disable this to prevent flooding logs
asyncify_advise = '0'

# Stack size for asyncify; increase this if you have problems with asyncify-induced crashes
asyncify_stack_size = '6144'

# Initial heap size in bytes; make sure it is not too low (around 64mb - 250mb)
initial_heap = '104857600'

# Emscripten is normally activated on PATH by scripts/build-web.sh or
# emsdk_env.sh. Set this to an absolute toolchain directory only when using
# Meson directly with a non-standard SDK installation.
toolchain = ''

# The memory allocator to use. You shouldn't need to change this,
# but other allocator might offer more performance at the cost of binary size.
malloc_impl = 'emmalloc'

# Functions exported by the main module.
# This is needed if you plan to load shared libraries which need symbols from the main binary.
# e.g. stdout, stderr, fopen, etc. Use another cross file to override this value.
exported_functions = '_main'

# Exported Filesystem modules.
# For example, you can put '-lidbfs.js' to export IDBFS for later use.
exported_filesystems = []

# Exported JS values in Module. FORCE_FILESYSTEM makes FS available to the
# launch shell, which creates the initial user directory and welcome document.
exported_js_values = '["FS"]'

# Extra link options passed to the linker.
extra_link_options = []

# In order to run Pragtical, you will also need to bundle the /data directory.
# The following option is added to the linking process to bundle the /data directory.
# If you want to do this manually or the automatic bundling process does not work,
# comment out the following line.
bundle_paths = ['--preload-file', '@GLOBAL_SOURCE_ROOT@/.build-web-data@/usr/share/pragtical/']

web_link_args = ['-sALLOW_MEMORY_GROWTH=1', '-sINITIAL_MEMORY=' + initial_heap, '-sASYNCIFY', '-sASYNCIFY_ADVISE=' + asyncify_advise, '-sASYNCIFY_STACK_SIZE=' + asyncify_stack_size, '-sASYNCIFY_REMOVE=' + asyncify_ignores, '-sFORCE_FILESYSTEM=1', '-sEXIT_RUNTIME=1', '-sENVIRONMENT=web', '-sMALLOC=' + malloc_impl, '-sEXPORTED_FUNCTIONS=' + exported_functions, '-sEXPORTED_RUNTIME_METHODS=' + exported_js_values] + extra_link_options + bundle_paths + exported_filesystems


[binaries]
c = toolchain / 'emcc'
cpp = toolchain / 'em++'
ar = toolchain / 'emar'
strip = toolchain / 'emstrip'
cmake = [toolchain / 'emcmake', 'cmake']
pkg-config = [toolchain / 'emconfigure', 'pkg-config']
sdl2-config = [toolchain / 'emconfigure', 'sdl2-config']


[properties]
needs_exe_wrapper = true


[built-in options]
c_args = ['-fPIC']
c_link_args = web_link_args
cpp_args = ['-fPIC']
cpp_link_args = web_link_args


[project options]
buildtype = 'release'
jit = false
ppm = false
portable = true
arch_tuple = 'wasm32-unknown'
wrap_mode = 'forcefallback'
force_fallback_for = 'lua,pcre2,freetype2'

[pcre2:project options]
jit = 'disabled'
jit_sealloc = 'disabled'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
