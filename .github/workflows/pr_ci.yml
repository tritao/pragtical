name: Pull Requests CI

on:
  push:
    branches:
      - next

  pull_request:
    branches:
      - '*'

  workflow_dispatch:

jobs:
  build_linux:
    name: Linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config:
        - { name: "GCC", cc: gcc, cxx: g++ }
        - { name: "clang", cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set Environment Variables
        if: ${{ matrix.config.cc == 'gcc' }}
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INSTALL_REF=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
          echo "INSTALL_NAME=pragtical-${GITHUB_REF##*/}-linux-$(uname -m)-portable" >> "$GITHUB_ENV"
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: 3.9
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
      - name: Update Packages
        run: sudo apt-get update
      - name: Install Dependencies
        run: bash scripts/install-dependencies.sh --debug
      - name: Build
        run: |
          set -o pipefail
          bash --version
          bash ./build.sh --debug --forcefallback --sqlite auto --portable 2>&1 | tee ci-build.log
      - name: Run Tests
        run: |
          source scripts/common.sh
          SDL_VIDEO_DRIVER=dummy ./scripts/run-local "$(get_default_build_dir)" test scripts/lua/tests
      - name: Run Workbench Tests
        if: ${{ matrix.config.cc == 'gcc' }}
        run: |
          source scripts/common.sh
          SDL_VIDEO_DRIVER=dummy ./scripts/test-workbench.sh "$(get_default_build_dir)"
      - name: Package
        if: ${{ matrix.config.cc == 'gcc' }}
        run: bash scripts/package.sh --version ${INSTALL_REF} --debug --binary
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.config.cc == 'gcc' }}
        with:
          name: Linux x86_64
          path: ${{ env.INSTALL_NAME }}.tar.gz
      - name: Upload Build Diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-linux-${{ matrix.config.name }}
          if-no-files-found: warn
          path: |
            ci-build.log
            build*/meson-logs/**
            build*/meson-private/coredata.dat

  build_web:
    name: Web (Emscripten)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Install build tools
        run: python -m pip install meson ninja
      - name: Build web distribution
        run: bash scripts/build-web.sh
      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: pragtical-web
          path: dist/web

  build_macos:
    name: macOS
    strategy:
      fail-fast: false
      matrix:
        config:
          - arch: x86_64
            image: macos-15-intel
          - arch: arm64
            image: macos-14
    runs-on: ${{ matrix.config.image }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: System Information
        run: |
          system_profiler SPSoftwareDataType
          bash --version
          gcc -v
          xcodebuild -version
      - name: Set Environment Variables
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INSTALL_REF=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
          echo "INSTALL_NAME=pragtical-${GITHUB_REF##*/}-macos-${{ matrix.config.arch }}" >> "$GITHUB_ENV"
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: 3.9
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
      - name: Install Dependencies
        run: bash scripts/install-dependencies.sh --debug
      - name: Build
        run: |
          set -o pipefail
          bash --version
          bash ./build.sh --bundle --debug --forcefallback --sqlite auto 2>&1 | tee ci-build.log
      - name: Run Tests
        run: |
          source scripts/common.sh
          SDL_VIDEO_DRIVER=dummy ./scripts/run-local "$(get_default_build_dir)" test scripts/lua/tests
      - name: Create DMG Image
        run: bash scripts/package.sh --version ${INSTALL_REF} --debug --dmg
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macOS DMG ${{ matrix.config.arch }}
          path: ${{ env.INSTALL_NAME }}.dmg
      - name: Upload Build Diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-macos-${{ matrix.config.arch }}
          if-no-files-found: warn
          path: |
            ci-build.log
            build*/meson-logs/**
            build*/meson-private/coredata.dat

  build_windows_msys2:
    name: Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config:
          # - {msystem: MINGW32, arch: i686, target: x86}
          - {msystem: MINGW64, arch: x86_64, target: x64}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.config.msystem }}
          install: >-
            base-devel
            git
            zip
            unzip
            mingw-w64-${{ matrix.config.arch }}-gcc
            mingw-w64-${{ matrix.config.arch }}-python-pip
            mingw-w64-${{ matrix.config.arch }}-ninja
            mingw-w64-${{ matrix.config.arch }}-cmake
            mingw-w64-${{ matrix.config.arch }}-ca-certificates
            mingw-w64-${{ matrix.config.arch }}-ntldd
      - name: Setup Meson
        run: |
          pip install meson --break-system-packages
      - name: Set Environment Variables
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INSTALL_REF=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
          if [[ "${MSYSTEM}" == "MINGW64" ]]; then
            echo "INSTALL_NAME=pragtical-${GITHUB_REF##*/}-windows-x86_64" >> "$GITHUB_ENV"
          else
            echo "INSTALL_NAME=pragtical-${GITHUB_REF##*/}-windows-i686" >> "$GITHUB_ENV"
          fi
      - name: Install Dependencies
        if: false
        run: bash scripts/install-dependencies.sh --debug
      - name: Build
        run: |
          set -o pipefail
          bash --version
          bash ./build.sh --debug --forcefallback --sqlite auto 2>&1 | tee ci-build.log
      - name: Run Tests
        run: |
          source scripts/common.sh
          SDL_VIDEO_DRIVER=dummy ./scripts/run-local "$(get_default_build_dir)" test scripts/lua/tests
      - name: Run Terminal Native Tests
        run: |
          source scripts/common.sh
          meson test -C "$(get_default_build_dir)" terminal-native-components --print-errorlogs --verbose
      - name: Run Workbench Windows Tests
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/ci/workbench-windows.ps1
      - name: Package
        run: bash scripts/package.sh --version ${INSTALL_REF} --debug --binary
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows (MSYS) ${{ matrix.config.target }}
          path: ${{ env.INSTALL_NAME }}.zip
      - name: Upload Build Diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-windows-msys-${{ matrix.config.target }}
          if-no-files-found: warn
          path: |
            ci-build.log
            build*/meson-logs/**
            build*/meson-private/coredata.dat

  build_windows_msvc:
    name: Windows (MSVC)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch:
          # - { target: x86, name: i686 }
          - { target: x64, name: x86_64 }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch.target }}
      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install meson and ninja
        run: pip install meson ninja
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
      - name: Set up environment variables
        run: |
          "INSTALL_NAME=pragtical-$($env:GITHUB_REF -replace ".*/")-windows-msvc-${{ matrix.arch.name }}" >> $env:GITHUB_ENV
          "INSTALL_REF=$($env:GITHUB_REF -replace ".*/")" >> $env:GITHUB_ENV
          "LUA_SUBPROJECT_PATH=subprojects/lua-5.4.6" >> $env:GITHUB_ENV
      - name: Configure
        run: |
          meson setup --wrap-mode=forcefallback -Dppm=false -Dsqlite=auto -Dnative_plugins=terminal build 2>&1 | Tee-Object -FilePath ci-configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          meson compile -j 1 -C build 2>&1 | Tee-Object -FilePath ci-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson install -C build --destdir="../pragtical" 2>&1 | Tee-Object -FilePath ci-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Terminal Native Tests
        run: |
          meson test -C build terminal-native-components --print-errorlogs --verbose
      - name: Package
        run: |
          Remove-Item -Recurse -Force -Path "pragtical/lib","pragtical/include"
          Compress-Archive -Path pragtical -DestinationPath "$env:INSTALL_NAME.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows (MSVC) ${{ matrix.arch.target }}
          path: ${{ env.INSTALL_NAME }}.zip
      - name: Upload Build Diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-windows-msvc-${{ matrix.arch.name }}
          if-no-files-found: warn
          path: |
            ci-configure.log
            ci-build.log
            ci-install.log
            build/meson-logs/**
            build/meson-private/coredata.dat
